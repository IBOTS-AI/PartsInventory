appId: com.ibots.inventory
productName: IBOTS Inventory
copyright: Copyright © 2026
asar: false
files:
  - installer/**
  - package.json
  - server/package.json
  - server/dist/**
  - client/dist/**
  - prisma/ibots.db
  - prisma/schema.prisma
  - node_modules/**
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IBOTS Inventory
  artifactName: ${productName}-Setup-${version}.${ext}
