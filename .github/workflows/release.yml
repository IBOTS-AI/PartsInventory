name: Build and publish Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to attach the release to (for example v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --publish never --config ./electron-builder.unsigned.yml

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibots-inventory-windows-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.exe
          generate_release_notes: true
